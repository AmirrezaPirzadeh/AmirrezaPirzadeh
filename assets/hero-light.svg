<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs>
<clipPath id="c"><rect width="1000" height="420" rx="32"/></clipPath>
<filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#3b5bdb"/><stop offset=".55" stop-color="#14b8a6"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
<style>.d1{animation:a 16s ease-in-out infinite alternate}.d2{animation:a 20s ease-in-out infinite alternate-reverse}.d3{animation:a 18s ease-in-out infinite alternate}
@keyframes a{to{transform:translate(70px,30px)}}
@media (prefers-reduced-motion:reduce){.d1,.d2,.d3{animation:none}}</style></defs><g clip-path="url(#c)"><rect width="1000" height="420" fill="#f5f5f7"/>
<g filter="url(#b)" opacity=".55"><circle class="d1" cx="780" cy="90" r="150" fill="#6e8bff"/><circle class="d2" cx="900" cy="330" r="130" fill="#4fd8c0"/><circle class="d3" cx="760" cy="390" r="100" fill="#ffb470"/></g></g>
<text x="72" y="168" font-size="84" font-weight="700" letter-spacing="-3" fill="#1d1d1f">Amirreza</text>
<text x="72" y="256" font-size="84" font-weight="700" letter-spacing="-3" fill="url(#g)">Pirzadeh</text>
<text x="74" y="318" font-size="26" fill="#6e6e73">Full-stack developer and network engineer.</text>
<text x="74" y="352" font-size="26" fill="#6e6e73">Web platforms, and the networks beneath them.</text></svg>